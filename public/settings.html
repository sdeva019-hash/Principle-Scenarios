<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings — Principle Scenarios</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0a1628;
      --bg-card: rgba(15, 23, 42, 0.8);
      --border: rgba(96, 165, 250, 0.15);
      --border-strong: rgba(96, 165, 250, 0.4);
      --text: #e8edf5;
      --text-muted: #94a3b8;
      --accent: #3b82f6;
      --accent-bright: #60a5fa;
      --accent-deep: #2563eb;
      --green: #22c55e;
      --red: #ef4444;
      --yellow: #fbbf24;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      background: radial-gradient(ellipse at top, #0e1f3a 0%, var(--bg) 60%);
      background-attachment: fixed;
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }
    a { color: var(--accent-bright); text-decoration: none; }
    button { font-family: inherit; cursor: pointer; }

    header {
      position: sticky; top: 0; z-index: 10;
      background: rgba(10, 22, 40, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
    }
    .nav-inner { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    .brand { font-weight: 700; font-size: 18px; display: flex; align-items: center; gap: 10px; }
    .brand .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent-bright); box-shadow: 0 0 12px var(--accent-bright); animation: pulse 2s infinite; }
    
    .app-layout { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: 280px 1fr; gap: 32px; padding: 32px 24px; align-items: start; }
    @media (max-width: 768px) { .app-layout { grid-template-columns: 1fr; } }

    .user-panel {
      position: sticky; top: 90px;
      background: var(--bg-card); backdrop-filter: blur(10px);
      border: 1px solid var(--border); border-radius: 14px; padding: 20px;
    }
    .user-profile { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
    .avatar {
      width: 44px; height: 44px; border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent-deep)); color: white;
      display: flex; align-items: center; justify-content: center;
      font-weight: 600; font-size: 16px; flex-shrink: 0;
      background-size: cover; background-position: center;
    }
    .user-info { flex: 1; overflow: hidden; }
    .user-name { font-size: 15px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .user-title { font-size: 12px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    
    .sidebar-nav { display: flex; flex-direction: column; gap: 4px; border-top: 1px solid var(--border); padding-top: 16px; }
    .sidebar-nav a {
      display: block; padding: 10px 14px; border-radius: 8px;
      color: var(--text-muted); font-size: 14px; font-weight: 500;
      text-decoration: none; transition: background 0.15s;
    }
    .sidebar-nav a:hover, .sidebar-nav a.active {
      background: rgba(59, 130, 246, 0.15); color: var(--text);
    }

    .kebab-btn { background: none; border: none; color: var(--text-muted); font-size: 20px; padding: 4px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .kebab-btn:hover { color: var(--text); background: rgba(255,255,255,0.05); }
    .dropdown-menu {
      position: absolute; top: 100%; left: 0; margin-top: 8px;
      background: rgba(15, 23, 42, 0.95); border: 1px solid var(--border-strong);
      border-radius: 10px; padding: 8px 0; min-width: 240px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: none; z-index: 20;
    }
    .dropdown-menu.show { display: block; }
    .dropdown-item {
      display: block; padding: 10px 16px; color: var(--text-muted);
      font-size: 13px; text-decoration: none; transition: all 0.15s;
    }
    .dropdown-item:hover { background: rgba(59, 130, 246, 0.15); color: var(--text); }

    .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 28px; backdrop-filter: blur(10px); margin-bottom: 24px; }
    .card-title { font-size: 18px; font-weight: 600; margin-bottom: 16px; display: flex; align-items: center; justify-content: space-between; }
    
    .setting-row { display: flex; align-items: center; justify-content: space-between; padding: 16px 0; border-bottom: 1px solid var(--border); }
    .setting-row:last-child { border-bottom: none; padding-bottom: 0; }
    .setting-info h4 { font-size: 14px; font-weight: 500; color: var(--text); margin-bottom: 4px; }
    .setting-info p { font-size: 13px; color: var(--text-muted); }

    /* Toggle switch CSS */
    .toggle {
      position: relative; display: inline-block; width: 44px; height: 24px; flex-shrink: 0;
    }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(255,255,255,0.1); transition: .2s; border-radius: 24px;
    }
    .slider:before {
      position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px;
      background-color: var(--text-muted); transition: .2s; border-radius: 50%;
    }
    input:checked + .slider { background-color: var(--accent); }
    input:checked + .slider:before { transform: translateX(20px); background-color: white; }

    /* Multiselect industries */
    .industries-grid { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
    .industry-tag {
      background: rgba(255,255,255,0.05); border: 1px solid var(--border);
      color: var(--text-muted); padding: 8px 14px; border-radius: 20px;
      font-size: 13px; cursor: pointer; transition: all 0.15s; user-select: none;
    }
    .industry-tag.selected {
      background: rgba(59, 130, 246, 0.15); border-color: var(--accent-bright); color: var(--accent-bright);
    }

    .btn-secondary {
      background: transparent; border: 1px solid var(--border-strong);
      color: var(--text); padding: 8px 16px; border-radius: 6px;
      font-size: 13px; font-weight: 500; transition: all 0.15s;
    }
    .btn-secondary:hover { background: rgba(255,255,255,0.05); }

    .submit-btn {
      background: linear-gradient(135deg, var(--accent), var(--accent-deep));
      border: none; color: white;
      padding: 12px 24px; border-radius: 10px;
      font-size: 15px; font-weight: 600;
      transition: transform 0.1s, box-shadow 0.15s;
    }
    .submit-btn:hover { transform: translateY(-1px); box-shadow: 0 8px 20px -6px rgba(59, 130, 246, 0.6); }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    const DEFAULT_INDUSTRIES = [
      'Artificial Intelligence', 'Enterprise Software', 'Strategy & Operations',
      'Venture Capital / Private Equity', 'Investment Banking / M&A', 'AI Infrastructure',
      'Digital Transformation', 'Data & Analytics', 'Cybersecurity', 'FinTech',
      'Cloud Infrastructure', 'Agentic AI'
    ];
    
    let state = { 
      me: null, 
      profile: null,
      settings: {
        emailNotifications: true,
        pushNotifications: true,
        profileHidden: false,
        industries: ['Artificial Intelligence']
      }
    };
    const app = document.getElementById('app');

    init();
    async function init() {
      try {
        const res = await fetch('/api/me');
        if (res.ok) {
          const data = await res.json();
          state.me = data.member;
          
          const savedProfile = localStorage.getItem('mockProfile');
          if (savedProfile) state.profile = { ...state.me, ...JSON.parse(savedProfile) };
          else state.profile = { ...state.me, industry: '' };
          
          const savedSettings = localStorage.getItem('mockSettings');
          if (savedSettings) state.settings = { ...state.settings, ...JSON.parse(savedSettings) };

          renderApp();
        } else {
          window.location.href = '/';
        }
      } catch (e) {
        window.location.href = '/';
      }
    }

    function toggleIndustry(industry, idx) {
      const i = state.settings.industries.indexOf(industry);
      if (i > -1) state.settings.industries.splice(i, 1);
      else state.settings.industries.push(industry);
      document.getElementById(`tag-${idx}`).classList.toggle('selected');
    }

    function muteNotifications() {
      state.settings.emailNotifications = false;
      state.settings.pushNotifications = false;
      document.getElementById('email-toggle').checked = false;
      document.getElementById('push-toggle').checked = false;
    }

    function saveSettings() {
      state.settings.emailNotifications = document.getElementById('email-toggle').checked;
      state.settings.pushNotifications = document.getElementById('push-toggle').checked;
      state.settings.profileHidden = document.getElementById('privacy-toggle').checked;
      
      localStorage.setItem('mockSettings', JSON.stringify(state.settings));
      
      const btn = document.getElementById('save-btn');
      btn.textContent = 'Saved!';
      const msg = document.getElementById('save-msg');
      msg.style.opacity = '1';
      
      setTimeout(() => {
        if (btn) btn.textContent = 'Save Preferences';
        if (msg) msg.style.opacity = '0';
      }, 3000);
    }

    function renderApp() {
      const fInit = (state.profile.firstName || 'U')[0];
      const lInit = (state.profile.lastName || '')[0] || '';
      const avatarStyle = state.profile.avatarUrl ? `background-image: url(${state.profile.avatarUrl}); background-color: transparent; color: transparent;` : '';
      
      app.innerHTML = `
        <header>
          <div class="nav-inner">
            <a href="/" class="brand" style="text-decoration: none; color: inherit;"><span class="dot"></span> Principle Scenarios</a>
            <div id="header-profile-container" style="display: flex; align-items: center; gap: 16px;">
              <div class="header-notifications" id="header-notifications-btn" style="position: relative; cursor: pointer; color: var(--text-muted); display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 50%; transition: background 0.15s;">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
                <span style="position: absolute; top: 2px; right: 4px; width: 8px; height: 8px; background: var(--red); border-radius: 50%; border: 2px solid var(--bg-card);"></span>
                <div class="dropdown-menu" id="header-notifications-dropdown" style="position: absolute; top: 100%; right: -10px; margin-top: 12px; background: rgba(15, 23, 42, 0.95); border: 1px solid var(--border-strong); border-radius: 12px; padding: 12px; width: 300px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); z-index: 20; cursor: default;">
                  <h3 style="font-size: 14px; font-weight: 600; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border); color: var(--text);">Notifications</h3>
                  <div style="display: flex; flex-direction: column; gap: 12px;">
                    <div style="display: flex; gap: 12px; align-items: flex-start;">
                      <div style="width: 32px; height: 32px; border-radius: 50%; background: var(--accent); color: white; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; flex-shrink: 0;">AS</div>
                      <div style="line-height: 1.4;">
                        <p style="font-size: 13px; color: var(--text); margin-bottom: 4px;"><strong>Alex Sterling</strong> replied to your comment on <em>AI Governance</em>.</p>
                        <span style="font-size: 11px; color: var(--text-muted);">2 hours ago</span>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
              <div class="header-profile" id="header-user-menu-btn" style="display: flex; align-items: center; gap: 8px; cursor: pointer; padding: 4px 8px; border-radius: 8px; transition: background 0.15s;">
                <div class="avatar" id="header-avatar-display" style="width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), var(--accent-deep)); color: white; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 13px; ${avatarStyle}">${escapeHtml(fInit)}${escapeHtml(lInit)}</div>
                <div class="menu-container" style="position: relative;">
                  <button class="kebab-btn" style="background: none; border: none; color: var(--text-muted); font-size: 20px; padding: 4px; cursor: pointer; display: flex; align-items: center; pointer-events: none;">&#8942;</button>
                  <div class="dropdown-menu" id="header-user-dropdown" style="position: absolute; top: 100%; right: 0; margin-top: 8px; background: rgba(15, 23, 42, 0.95); border: 1px solid var(--border-strong); border-radius: 10px; padding: 8px 0; min-width: 180px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); z-index: 20;">
                    <a href="/profile.html" class="dropdown-item" style="display: flex; align-items: center; gap: 10px; padding: 10px 16px; color: var(--text-muted); font-size: 13px; text-decoration: none;">
                      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                      Update account
                    </a>

                    <a href="#" class="dropdown-item" id="header-logout" style="display: flex; align-items: center; gap: 10px; padding: 10px 16px; color: var(--red); font-size: 13px; text-decoration: none;">
                      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                      Sign out
                    </a>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </header>
        <div class="app-layout">
          <aside class="user-panel">
            <div class="user-profile">
              <div class="avatar" style="${avatarStyle}">${escapeHtml(fInit)}${escapeHtml(lInit)}</div>
              <div class="user-info">
                <div class="user-name">${escapeHtml(state.profile.firstName)} ${escapeHtml(state.profile.lastName)}</div>
                <div class="user-title">${escapeHtml(state.profile.jobTitle)} at ${escapeHtml(state.profile.companyName)}</div>
              </div>
            </div>
            <div class="sidebar-nav">
              <a href="/">Feed</a>
              <a href="/events.html">Events</a>
              <a href="/settings.html" class="active">Settings</a>
            </div>
          </aside>
          <main class="feed-content">
            <div style="margin-bottom: 24px;">
              <h1 style="font-size: 28px; font-weight: 700; margin-bottom: 6px;">Settings</h1>
              <p style="color: var(--text-muted); font-size: 14px;">Manage your preferences and privacy.</p>
            </div>
            
            <div class="card">
              <div class="card-title">Industries</div>
              <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 12px;">Select industries to tune your simulation recommendations.</p>
              <div class="industries-grid">
                ${DEFAULT_INDUSTRIES.map((ind, idx) => `
                  <div class="industry-tag ${state.settings.industries.includes(ind) ? 'selected' : ''}" id="tag-${idx}" onclick="toggleIndustry('${ind}', ${idx})">${ind}</div>
                `).join('')}
              </div>
            </div>

            <div class="card">
              <div class="card-title">
                Notifications
                <button class="btn-secondary" onclick="muteNotifications()">Mute All</button>
              </div>
              <div class="setting-row">
                <div class="setting-info">
                  <h4>Email Notifications</h4>
                  <p>Receive daily simulation digests and mentions via email.</p>
                </div>
                <label class="toggle">
                  <input type="checkbox" id="email-toggle" ${state.settings.emailNotifications ? 'checked' : ''}>
                  <span class="slider"></span>
                </label>
              </div>
              <div class="setting-row">
                <div class="setting-info">
                  <h4>Push Notifications</h4>
                  <p>Get instant alerts for posts and comments.</p>
                </div>
                <label class="toggle">
                  <input type="checkbox" id="push-toggle" ${state.settings.pushNotifications ? 'checked' : ''}>
                  <span class="slider"></span>
                </label>
              </div>
            </div>

            <div class="card">
              <div class="card-title">Privacy</div>
              <div class="setting-row">
                <div class="setting-info">
                  <h4>Make my profile hidden</h4>
                  <p>When turned on, your name will be hidden as "Private user" in comments, but your title and company will remain visible.</p>
                </div>
                <label class="toggle">
                  <input type="checkbox" id="privacy-toggle" ${state.settings.profileHidden ? 'checked' : ''}>
                  <span class="slider"></span>
                </label>
              </div>
            </div>

            <div style="display: flex; align-items: center; justify-content: flex-end; gap: 16px;">
              <span id="save-msg" style="color: var(--green); font-size: 14px; opacity: 0; transition: opacity 0.2s;">Preferences saved!</span>
              <button class="submit-btn" id="save-btn" onclick="saveSettings()">Save Preferences</button>
            </div>
          </main>
        </div>`;

      // Header handlers
      document.getElementById('header-user-menu-btn')?.addEventListener('click', (e) => {
        if (e.target.closest('#header-user-dropdown')) return;
        e.stopPropagation();
        document.getElementById('header-user-dropdown').classList.toggle('show');
        document.getElementById('header-notifications-dropdown')?.classList.remove('show');
      });
      document.getElementById('header-notifications-btn')?.addEventListener('click', (e) => {
        if (e.target.closest('#header-notifications-dropdown')) return;
        e.stopPropagation();
        document.getElementById('header-notifications-dropdown').classList.toggle('show');
        document.getElementById('header-user-dropdown')?.classList.remove('show');
      });
      document.addEventListener('click', () => {
        document.getElementById('header-user-dropdown')?.classList.remove('show');
        document.getElementById('header-notifications-dropdown')?.classList.remove('show');
      });
      document.getElementById('header-logout')?.addEventListener('click', async (e) => {
        e.preventDefault();
        await fetch('/api/auth/logout', { method: 'POST' });
        window.location.href = '/';
      });
    }

    function escapeHtml(s) {
      return String(s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }
  </script>
</body>
</html>
