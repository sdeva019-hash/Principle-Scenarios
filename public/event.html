<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event Detail — Principle Scenarios</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0a1628;
      --bg-card: rgba(15, 23, 42, 0.8);
      --border: rgba(96, 165, 250, 0.15);
      --border-strong: rgba(96, 165, 250, 0.4);
      --text: #e8edf5;
      --text-muted: #94a3b8;
      --accent: #3b82f6;
      --accent-bright: #60a5fa;
      --accent-deep: #2563eb;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      background: radial-gradient(ellipse at top, #0e1f3a 0%, var(--bg) 60%);
      background-attachment: fixed;
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }
    a { color: var(--accent-bright); text-decoration: none; }
    button { font-family: inherit; cursor: pointer; }

    /* ---------- Top nav ---------- */
    header {
      position: sticky; top: 0; z-index: 10;
      background: rgba(10, 22, 40, 0.85); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border); padding: 16px 24px;
    }
    .nav-inner {
      max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 20px;
    }
    .brand { font-weight: 700; font-size: 18px; display: flex; align-items: center; gap: 10px; }
    .brand .dot {
      width: 10px; height: 10px; border-radius: 50%; background: var(--accent-bright);
      box-shadow: 0 0 12px var(--accent-bright); animation: pulse 2s infinite;
    }
    .nav-links { display: flex; gap: 8px; align-items: center; }
    .nav-links a {
      padding: 8px 14px; border-radius: 8px; color: var(--text-muted); font-size: 14px; font-weight: 500;
    }
    .nav-links a:hover, .nav-links a.active { background: rgba(59, 130, 246, 0.15); color: var(--text); }
    .me-chip { font-size: 13px; color: var(--text-muted); }

    /* ---------- Layout ---------- */
    .app-layout { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: 280px 1fr; gap: 32px; padding: 32px 24px; align-items: start; }
    @media (max-width: 768px) { .app-layout { grid-template-columns: 1fr; } }
    main.feed-content { padding: 0; min-width: 0; }

    /* ---------- User Panel Sidebar ---------- */
    .user-panel {
      position: sticky; top: 90px;
      background: var(--bg-card); backdrop-filter: blur(10px);
      border: 1px solid var(--border); border-radius: 14px; padding: 20px;
    }
    .user-profile { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
    .avatar {
      width: 44px; height: 44px; border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent-deep)); color: white;
      display: flex; align-items: center; justify-content: center;
      font-weight: 600; font-size: 16px; flex-shrink: 0;
    }
    .user-info { flex: 1; overflow: hidden; }
    .user-name { font-size: 15px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .user-title { font-size: 12px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    
    .menu-container { position: relative; }
    .kebab-btn { background: none; border: none; color: var(--text-muted); font-size: 20px; padding: 4px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .kebab-btn:hover { color: var(--text); background: rgba(255,255,255,0.05); }
    .dropdown-menu {
      position: absolute; top: 100%; left: 0; margin-top: 8px;
      background: rgba(15, 23, 42, 0.95); border: 1px solid var(--border-strong);
      border-radius: 10px; padding: 8px 0; min-width: 240px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: none; z-index: 20;
    }
    .dropdown-menu.show { display: block; }
    .dropdown-item {
      display: block; padding: 10px 16px; color: var(--text-muted); font-size: 13px; text-decoration: none; transition: all 0.15s;
    }
    .dropdown-item:hover { background: rgba(59, 130, 246, 0.15); color: var(--text); }

    .sidebar-nav { display: flex; flex-direction: column; gap: 4px; border-top: 1px solid var(--border); padding-top: 16px; }
    .sidebar-nav a {
      display: block; padding: 10px 14px; border-radius: 8px; color: var(--text-muted); font-size: 14px; font-weight: 500; text-decoration: none; transition: background 0.15s;
    }
    .sidebar-nav a:hover, .sidebar-nav a.active { background: rgba(59, 130, 246, 0.15); color: var(--text); }

    .back { font-size: 13px; color: var(--text-muted); margin-bottom: 16px; display: inline-block; }
    .back:hover { color: var(--text); }

    /* ---------- Event Detail ---------- */
    .event-header {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px;
      padding: 32px; backdrop-filter: blur(10px); margin-bottom: 20px;
    }
    .badge {
      display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.5px; padding: 4px 10px; border-radius: 999px;
      background: rgba(59, 130, 246, 0.15); color: var(--accent-bright); margin-bottom: 14px;
    }
    .event-title { font-size: 32px; font-weight: 700; line-height: 1.25; margin-bottom: 16px; }
    .event-meta { font-size: 16px; color: var(--text-muted); display: flex; align-items: center; gap: 8px; margin-bottom: 24px; }
    .event-desc { font-size: 16px; color: var(--text-muted); line-height: 1.6; margin-bottom: 32px; }
    .join-btn {
      background: var(--accent-deep); border: 1px solid var(--accent-deep); color: white;
      padding: 12px 24px; border-radius: 10px; font-size: 15px; font-weight: 600;
      transition: all 0.15s; display: inline-block; text-align: center;
    }
    .join-btn:hover { background: var(--accent); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4); }
    .empty { text-align: center; color: var(--text-muted); padding: 60px 20px; }

  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    const events = [
      { id: 1, title: 'AI Market Foresight Vol 2', date: 'June 3, 2026', link: 'https://partiful.com/e/MapuUg1D3MB9pAp550DP', description: 'Join us for an in-depth discussion on AI market trends, potential disruptions, and strategic foresights. This event will feature key industry leaders and a deep dive into our latest simulation models.' },
      { id: 2, title: 'AI World Modeling Dinner', date: 'June 5, 2026', link: 'https://partiful.com/e/T7fUPRr3KArqfToIuGRR', description: 'An exclusive dinner for senior decision-makers to discuss the implications of advanced AI world modeling. We will explore how simulated realities can drive better strategic outcomes.' }
    ];
    const state = { me: null };
    const app = document.getElementById('app');
    const params = new URLSearchParams(window.location.search);
    const eventId = parseInt(params.get('id'), 10);
    const currentEvent = events.find(e => e.id === eventId);

    init();
    async function init() {
      try {
        const res = await fetch('/api/me');
        if (res.ok) {
          state.me = (await res.json()).member;
          renderApp();
        } else {
          window.location.href = '/';
        }
      } catch (e) {
        window.location.href = '/';
      }
    }

    function renderApp() {
      let contentHtml = '';
      if (!currentEvent) {
        contentHtml = `<div class="empty">Event not found. <a href="/events.html">← Back to events</a></div>`;
      } else {
        contentHtml = `
          <a href="/events.html" class="back">← Back to events</a>
          <div class="event-header">
            <span class="badge">Event</span>
            <h1 class="event-title">${escapeHtml(currentEvent.title)}</h1>
            <div class="event-meta">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
              ${escapeHtml(currentEvent.date)}
            </div>
            <p class="event-desc">${escapeHtml(currentEvent.description)}</p>
            <a href="${escapeHtml(currentEvent.link)}" target="_blank" class="join-btn" rel="noopener noreferrer">Join Event</a>
          </div>
        `;
      }

      app.innerHTML = `
        <header>
          <div class="nav-inner">
            <a href="/" class="brand" style="text-decoration: none; color: inherit;"><span class="dot"></span> Principle Scenarios</a>
            <div id="header-profile-container" style="display: flex; align-items: center; gap: 16px;">
              <div class="header-notifications" id="header-notifications-btn" style="position: relative; cursor: pointer; color: var(--text-muted); display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 50%; transition: background 0.15s;">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
                <span style="position: absolute; top: 2px; right: 4px; width: 8px; height: 8px; background: var(--red); border-radius: 50%; border: 2px solid var(--bg-card);"></span>
                <div class="dropdown-menu" id="header-notifications-dropdown" style="position: absolute; top: 100%; right: -10px; margin-top: 12px; background: rgba(15, 23, 42, 0.95); border: 1px solid var(--border-strong); border-radius: 12px; padding: 12px; width: 300px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); z-index: 20; cursor: default;">
                  <h3 style="font-size: 14px; font-weight: 600; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border); color: var(--text);">Notifications</h3>
                  <div style="display: flex; flex-direction: column; gap: 12px;">
                    <div style="display: flex; gap: 12px; align-items: flex-start;">
                      <div style="width: 32px; height: 32px; border-radius: 50%; background: var(--accent); color: white; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; flex-shrink: 0;">AS</div>
                      <div style="line-height: 1.4;">
                        <p style="font-size: 13px; color: var(--text); margin-bottom: 4px;"><strong>Alex Sterling</strong> replied to your comment on <em>AI Governance</em>.</p>
                        <span style="font-size: 11px; color: var(--text-muted);">2 hours ago</span>
                      </div>
                    </div>
                    <div style="display: flex; gap: 12px; align-items: flex-start;">
                      <div style="width: 32px; height: 32px; border-radius: 50%; background: var(--bg-card); border: 1px solid var(--border); color: var(--text-muted); display: flex; align-items: center; justify-content: center; font-size: 12px; flex-shrink: 0;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg></div>
                      <div style="line-height: 1.4;">
                        <p style="font-size: 13px; color: var(--text); margin-bottom: 4px;">Your WhatIf submission <em>'AI Resource Scarcity'</em> is under review.</p>
                        <span style="font-size: 11px; color: var(--text-muted);">Yesterday</span>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
              <div class="header-profile" id="header-user-menu-btn" style="display: flex; align-items: center; gap: 8px; cursor: pointer; padding: 4px 8px; border-radius: 8px; transition: background 0.15s;">
                <div class="avatar" id="header-avatar-display" style="width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), var(--accent-deep)); color: white; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 13px;">${escapeHtml((state.me.firstName || 'U')[0])}${escapeHtml((state.me.lastName || '')[0] || '')}</div>
                <div class="menu-container" style="position: relative;">
                  <button class="kebab-btn" style="background: none; border: none; color: var(--text-muted); font-size: 20px; padding: 4px; cursor: pointer; display: flex; align-items: center; pointer-events: none;">&#8942;</button>
                  <div class="dropdown-menu" id="header-user-dropdown" style="position: absolute; top: 100%; right: 0; margin-top: 8px; background: rgba(15, 23, 42, 0.95); border: 1px solid var(--border-strong); border-radius: 10px; padding: 8px 0; min-width: 180px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); z-index: 20;">
                    <a href="/profile.html" class="dropdown-item" style="display: flex; align-items: center; gap: 10px; padding: 10px 16px; color: var(--text-muted); font-size: 13px; text-decoration: none;">
                      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                      Update account
                    </a>

                    <a href="#" class="dropdown-item" id="header-logout" style="display: flex; align-items: center; gap: 10px; padding: 10px 16px; color: var(--red); font-size: 13px; text-decoration: none;">
                      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                      Sign out
                    </a>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </header>
        <div class="app-layout">
          <aside class="user-panel">
            <div class="user-profile">
              <div class="avatar">${escapeHtml((state.me.firstName || 'U')[0])}${escapeHtml((state.me.lastName || '')[0] || '')}</div>
              <div class="user-info">
                <div class="user-name">${escapeHtml(state.me.firstName)} ${escapeHtml(state.me.lastName)}</div>
                <div class="user-title">${escapeHtml(state.me.jobTitle)} at ${escapeHtml(state.me.companyName)}</div>
              </div>
            </div>
            <div class="sidebar-nav">
              <a href="/">Feed</a>
              <a href="/events.html" class="active">Events</a>
              <a href="/settings.html">Settings</a>
            </div>
          </aside>
          <main class="feed-content">
            ${contentHtml}
          </main>
        </div>`;

      // Handlers
      document.getElementById('header-user-menu-btn')?.addEventListener('click', (e) => {
        if (e.target.closest('#header-user-dropdown')) return;
        e.stopPropagation();
        document.getElementById('header-user-dropdown').classList.toggle('show');
        document.getElementById('header-notifications-dropdown')?.classList.remove('show');
      });
      document.getElementById('header-notifications-btn')?.addEventListener('click', (e) => {
        if (e.target.closest('#header-notifications-dropdown')) return;
        e.stopPropagation();
        document.getElementById('header-notifications-dropdown').classList.toggle('show');
        document.getElementById('header-user-dropdown')?.classList.remove('show');
      });
      document.addEventListener('click', () => {
        document.getElementById('header-user-dropdown')?.classList.remove('show');
        document.getElementById('header-notifications-dropdown')?.classList.remove('show');
      });
      document.getElementById('header-logout')?.addEventListener('click', async (e) => {
        e.preventDefault();
        await fetch('/api/auth/logout', { method: 'POST' });
        window.location.href = '/';
      });
    }

    function escapeHtml(s) {
      return String(s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }
  </script>
</body>
</html>
